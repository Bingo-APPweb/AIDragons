name: Release

on:
  push:
    branches: [main]
    # Skip CI for version bumps and docs
    paths-ignore:
      - '**/*.md'
      - '**/docs/**'
      - 'CHANGELOG.md'

# Minimal permissions needed
permissions:
  contents: write
  id-token: write  # Required for OIDC

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Environment protection - requires approval from @bbf-core or @bbf-security
    environment:
      name: release
      url: https://github.com/bbf-tables/bbf-tables/releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@b4ffde65f2b0c1d120c98645e7ecff865c949e6f  # v4.1.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@60edb5e6d9eec231d8a5b5bde8e0d691aaf3b0a6  # v4.1.0
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Verify build
        run: npm run build
      
      - name: Run tests
        run: npm test
      
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.GH_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'  # Enable provenance for npm packages
          
      - name: Verify release
        if: success()
        run: |
          echo "Release published successfully!"
          echo "Version: $(jq -r '.version' package.json)"
